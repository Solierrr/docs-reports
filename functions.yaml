# Papéis e scripts do SDD em formato de consulta. NNN é o número do documento (001, 002...).
# Caminhos relativos à raiz do repositório. Leia só a chave de que precisa.

agents:
  orchestrator:
    file: agents/orchestrator.md
    role: Sessão principal. Conduz o grilling, despacha, faz a reflexão do ciclo e decide.
    when: sempre; é quem recebe o pedido
    reads: [AGENTS.md, skills/grilling/SKILL.md, checklists/orchestrator.md, .work/NNN/review.md]
    writes: [.work/NNN/spec.md, .work/NNN/log.md, documents/NNN/checklist.md]
    checklist: checklists/orchestrator.md
    scripts: [new, check, index, commit]
    skills: [grilling]
    context: principal
  writer:
    file: agents/writer.md
    role: Refinador e idealizador. Escreve o conteúdo em Markdown, um bloco por espaço do modelo.
    when: depois da spec aprovada, e quando a reflexão devolve uma falha de conteúdo
    reads: [.work/NNN/spec.md, .work/NNN/sources.md, templates/<type>.html, editorial.md]
    writes: [.work/NNN/content.md]
    checklist: lentes em agents/writer.md
    scripts: []
    skills: [fix]
    context: novo ou principal, nunca o do reviewer
  builder:
    file: agents/builder.md
    role: Implementador. Escreve o conteúdo no source.html do modelo, gera o documento paginado e o PDF.
    when: depois do writer, quando a reflexão devolve uma falha de montagem, e no PDF final
    reads: [.work/NNN/spec.md, .work/NNN/content.md, documents/NNN/source.html, templates/AGENTS.md, design/components.html, editorial.md]
    writes: [documents/NNN/source.html, documents/NNN/index.html, documents/NNN/NNN.pdf]
    checklist: checklists/structure.md
    scripts: [build, check, pdf]
    skills: [fix]
    context: novo ou principal, nunca o do reviewer
  reviewer:
    file: agents/reviewer.md
    role: Revisor de design bruto. Ortografia, texto cortado, legibilidade, contraste e organização. Só aponta.
    when: depois de cada montagem com check.sh limpo, e uma olhada final no PDF
    reads: [documents/NNN/index.html, documents/NNN/checklist.md, checklists/reviewer.md]
    writes: [.work/NNN/review.md, .work/NNN/captures/]
    checklist: checklists/reviewer.md
    scripts: [check]
    context: sempre separado de quem escreveu ou montou
  researcher:
    file: agents/researcher.md
    role: Opcional. Reúne fontes com origem, data e limitações.
    when: quando a spec aponta lacuna de fontes, e em relatórios por período
    reads: [.work/NNN/spec.md, material do usuário]
    writes: [.work/NNN/sources.md, .work/NNN/sources/]
    checklist: regras em agents/researcher.md
    scripts: []
    skills: [sources]
    context: novo

scripts:
  new:
    usage: sh scripts/new.sh <type> <slug> "<título>"
    args: {type: report | manual | faq | document, slug: uma palavra em inglês, título: título do documento}
    does: Cria documents/NNN/source.html (cópia do modelo com conteúdo de exemplo) e checklist.md, e .work/NNN/ com spec, content, review e log. NNN é o maior número existente mais um.
    output: o número criado, os caminhos e o documento anterior (número e título)
  check:
    usage: sh scripts/check.sh <NNN>
    does: Verificações estruturais de checklists/structure.md no source.html, no index.html, no PDF (se existir) e no checklist.md.
    output: só as falhas, uma por linha; "ok NNN" se nada falhar
    exit: 0 sem falhas, 1 com falhas
  build:
    usage: sh scripts/build.sh <NNN>
    does: Gera documents/NNN/index.html do source.html. Desenha os gráficos data-chart (ECharts), monta o sumário, pagina em A4 com o Paged.js num Chrome ou Edge headless, preenche cabeçalho, rodapé e números, embute CSS e logo e tira os scripts.
    output: o arquivo e o número de páginas
    exit: 0 gerado, 1 falha (sem navegador, gráfico inválido ou paginação que não terminou)
  pdf:
    usage: sh scripts/pdf.sh <NNN>
    does: Imprime documents/NNN/index.html (já paginado) em documents/NNN/NNN.pdf com Chrome ou Edge headless (BROWSER sobrescreve).
    output: caminho do PDF e número de páginas
    exit: 0 gerado, 1 sem navegador ou falha
  index:
    usage: sh scripts/index.sh [docs]
    does: Imprime os cabeçalhos YAML dos AGENTS.md, agentes e checklists; com "docs", lista os documentos.
    output: uma linha por arquivo ou documento
  commit:
    usage: sh scripts/commit.sh <NNN>
    does: Roda check.sh, exige o PDF, cria a branch docs/NNN a partir da main, commita só documents/NNN (source, index, PDF e checklist), faz push e abre a PR.
    env: {AI_TRAILER: linha de coautoria opcional acrescentada ao commit}
    output: a URL da PR
    exit: 0 PR aberta, 1 falha de verificação ou de git
